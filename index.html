<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WahyuStore</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    color: white;
    background: #080808;
    overflow-x: hidden;
}

/* BACKGROUND MERAH AESTHETIC */
body::before,
body::after {
    content: "";
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(120px);
    z-index: -1;
}

body::before {
    background: #ff003c;
    top: -150px;
    left: -150px;
    opacity: .45;
    animation: move1 8s infinite alternate;
}

body::after {
    background: #9b001f;
    right: -150px;
    bottom: -150px;
    opacity: .5;
    animation: move2 10s infinite alternate;
}

@keyframes move1 {
    to {
        transform: translate(180px, 150px);
    }
}

@keyframes move2 {
    to {
        transform: translate(-180px, -120px);
    }
}

.container {
    width: 92%;
    max-width: 500px;
    margin: auto;
    padding: 25px 0 40px;
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 4px;
    margin-bottom: 25px;
}

.card {
    background: rgba(18,18,18,.82);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 24px;
    padding: 14px;
    backdrop-filter: blur(18px);
    box-shadow: 0 20px 50px rgba(0,0,0,.55);
}

.image-box {
    width: 100%;
    height: 330px;
    border-radius: 18px;
    overflow: hidden;
    background: #151515;
}

.image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.dots {
    text-align: center;
    margin: 13px 0;
}

.dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin: 0 4px;
    border-radius: 50%;
    background: #555;
}

.dot.active {
    background: #ff1744;
    box-shadow: 0 0 10px #ff1744;
}

.name {
    font-size: 23px;
    font-weight: bold;
    margin-top: 8px;
}

.price {
    color: #ff3157;
    font-size: 21px;
    font-weight: bold;
    margin-top: 8px;
}

.description {
    color: #bdbdbd;
    font-size: 14px;
    line-height: 1.6;
    margin-top: 14px;
}

.buy {
    display: block;
    text-align: center;
    text-decoration: none;
    color: white;
    font-weight: bold;
    background: linear-gradient(90deg,#ff003c,#a9002d);
    padding: 15px;
    border-radius: 14px;
    margin-top: 20px;
    box-shadow: 0 8px 25px rgba(255,0,60,.3);
}
</style>
</head>
